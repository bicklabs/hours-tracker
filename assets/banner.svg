<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Clinical Hours Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FB"/><stop offset="1" stop-color="#E7ECF9"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F3D99"/><stop offset="1" stop-color="#0E1A33"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0E1A33" flood-opacity=".16"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="1330" cy="90" r="330" fill="#8FB0EA" fill-opacity=".18"/>
  <circle cx="1560" cy="600" r="240" fill="#1F3D99" fill-opacity=".07"/>
  <!-- logo -->
  <g transform="translate(120 132) scale(.3125)">
    <rect width="512" height="512" rx="112" fill="#1F3D99"/><circle cx="256" cy="282" r="150" fill="#FDFDFE" fill-opacity=".14" stroke="#FDFDFE" stroke-width="36"/><path d="M256 200v82l54 34" fill="none" stroke="#FDFDFE" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><path d="M218 74h76M392 138l26-26" fill="none" stroke="#8FB0EA" stroke-width="36" stroke-linecap="round"/>
  </g>
  <text x="300" y="234" font-size="92" font-weight="700" fill="#0E1A33" letter-spacing="-2.5">Clinical Hours</text>
  <text x="120" y="372" font-size="44" font-weight="500" fill="#5F6A7F">Track clinical, shadowing, volunteering</text>
  <text x="120" y="426" font-size="44" font-weight="500" fill="#5F6A7F">and research hours. Stored on your device.</text>
  <g transform="translate(120 480)">
    <rect width="250" height="52" rx="26" fill="#1F3D99"/><text x="125" y="34" font-size="22" font-weight="600" fill="#FDFDFE" text-anchor="middle">No Account Needed</text>
    <rect x="266" width="232" height="52" rx="26" fill="#FDFDFE" stroke="#1F3D99" stroke-width="2"/><text x="382" y="34" font-size="22" font-weight="600" fill="#1F3D99" text-anchor="middle">Works Offline</text>
  </g>
  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="1010" y="70" width="300" height="600" rx="46" fill="#0E1A33"/>
    <rect x="1020" y="80" width="280" height="580" rx="38" fill="#F2F4F7"/>
  </g>
  <rect x="1044" y="112" width="232" height="132" rx="24" fill="url(#hero)"/>
  <text x="1064" y="146" font-size="15" font-weight="600" fill="#8FB0EA">CLOCKED IN</text>
  <text x="1064" y="200" font-size="52" font-weight="700" fill="#FDFDFE">02:14</text>
  <text x="1064" y="228" font-size="15" fill="#B7C6E3">City Hospital · Clinical</text>
  <rect x="1044" y="262" width="110" height="112" rx="22" fill="#FDFDFE"/><rect x="1166" y="262" width="110" height="112" rx="22" fill="#FDFDFE"/>
  <rect x="1044" y="386" width="110" height="112" rx="22" fill="#FDFDFE"/><rect x="1166" y="386" width="110" height="112" rx="22" fill="#FDFDFE"/>
  <g font-size="30" font-weight="700" fill="#0E1A33"><text x="1062" y="330">128</text><text x="1184" y="330">42</text><text x="1062" y="454">65</text><text x="1184" y="454">210</text></g>
  <g font-size="13" fill="#5F6A7F"><text x="1062" y="352">Clinical</text><text x="1184" y="352">Shadowing</text><text x="1062" y="476">Volunteering</text><text x="1184" y="476">Research</text></g>
  <circle cx="1057" cy="288" r="0" fill="none"/>
  <rect x="1062" y="276" width="18" height="6" rx="3" fill="#0E1A33"/><rect x="1184" y="276" width="18" height="6" rx="3" fill="#4A6FC4"/><rect x="1062" y="400" width="18" height="6" rx="3" fill="#1F3D99"/><rect x="1184" y="400" width="18" height="6" rx="3" fill="#8FB0EA"/>
  <rect x="1044" y="516" width="232" height="16" rx="8" fill="#E3E7EE"/><rect x="1044" y="516" width="150" height="16" rx="8" fill="#1F3D99"/>
  <rect x="1130" y="600" width="60" height="6" rx="3" fill="#B7C6E3"/>
</svg>
